name: Nightly Spotify Sync

on:
  schedule:
    - cron: '0 3 * * *'  # 3am UTC every night
  workflow_dispatch:       # trigger manually from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install curl
        run: sudo apt-get install -y curl

      - name: Run Spotify sync
        run: |
          curl -X POST https://opus-platform.onrender.com/v1/spotify/run-sync \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.API_KEY }}" \
            -d '{}'
