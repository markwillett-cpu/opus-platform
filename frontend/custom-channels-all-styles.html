<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Custom Channels — Music Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#b8956a;
  --gold-dark:#9a7a55;
  --bg:#f7f6f2;
  --card:#ffffff;
  --text:#1c1b18;
  --muted:#7a7870;
  --border:#e2e0d8;
  --border-dark:#ccc9be;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* NAV */
.nav{background:#fff;border-bottom:0.5px solid var(--border);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:32px;width:auto}
.demo-btn{background:var(--gold);color:#fff;border:none;padding:9px 20px;border-radius:4px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;letter-spacing:0.02em;transition:background 0.15s}
.demo-btn:hover{background:var(--gold-dark)}

/* HERO */
.hero{padding:3.5rem 2rem 2.5rem;text-align:center;max-width:700px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:0.8rem;font-weight:500}
.headline{font-family:'Lora',Georgia,serif;font-style:italic;font-size:2.4rem;color:var(--text);line-height:1.25;margin-bottom:0.75rem}
.subline{font-size:15px;color:var(--muted);line-height:1.6}

/* CONTROLS */
.controls-wrap{max-width:960px;margin:0 auto;padding:0 2rem 1rem}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap input{
  width:100%;border:0.5px solid var(--border);border-radius:4px;
  padding:9px 12px 9px 34px;font-size:14px;background:#fff;color:var(--text);
  outline:none;font-family:'DM Sans',sans-serif;transition:border-color 0.15s
}
.search-wrap input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-icon svg{width:15px;height:15px;display:block}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pill{
  background:transparent;border:0.5px solid var(--border);border-radius:20px;
  padding:7px 15px;font-size:12px;cursor:pointer;color:var(--muted);
  font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.15s;white-space:nowrap
}
.pill:hover{border-color:var(--gold);color:var(--gold)}
.pill.active{background:var(--gold);border-color:var(--gold);color:#fff}
.count{font-size:12px;color:var(--muted);letter-spacing:0.02em}

/* GRID */
.grid-wrap{max-width:960px;margin:0 auto;padding:0 2rem}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:1px;background:var(--border);
  border:0.5px solid var(--border);border-radius:4px;overflow:hidden
}
.card{background:var(--card);display:flex;flex-direction:column;cursor:pointer;position:relative;overflow:hidden}
.card:hover .overlay{opacity:1}
.card:hover .art{transform:scale(1.05)}
.art-wrap{width:100%;aspect-ratio:1/1;overflow:hidden;background:#ede9e2;position:relative}
.art{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.35s ease}
.overlay{
  position:absolute;inset:0;
  background:rgba(20,18,14,0.32);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 0.2s
}
.card.is-playing .overlay{opacity:1}
.play-btn{
  width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,0.93);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.15s
}
.play-btn:hover{transform:scale(1.08)}
.play-icon{
  width:0;height:0;border-style:solid;
  border-width:9px 0 9px 16px;
  border-color:transparent transparent transparent #1c1b18;
  margin-left:4px
}
.pause-bars{display:flex;gap:4px;align-items:center}
.pause-bars span{width:4px;height:17px;background:#1c1b18;border-radius:1px;display:block}
.no-sample .play-btn{opacity:0.4;cursor:default}
.card-info{padding:11px 13px 14px}
.card-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{font-size:11.5px;color:var(--muted);line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* NOW PLAYING BAR */
.now-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:#1c1b18;color:#fff;
  padding:0 2rem;height:64px;
  display:flex;align-items:center;gap:14px;
  z-index:200;
  transform:translateY(100%);transition:transform 0.28s ease
}
.now-bar.visible{transform:translateY(0)}
.now-art{width:40px;height:40px;object-fit:cover;border-radius:2px;flex-shrink:0;background:#333}
.now-info{flex:1;min-width:0}
.now-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-tag{font-size:11px;color:rgba(255,255,255,0.45);margin-top:2px}
.now-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
.stop-btn{
  background:transparent;border:0.5px solid rgba(255,255,255,0.25);
  color:rgba(255,255,255,0.8);padding:7px 16px;border-radius:4px;
  font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:border-color 0.15s,color 0.15s;white-space:nowrap
}
.stop-btn:hover{border-color:rgba(255,255,255,0.5);color:#fff}
.loading{text-align:center;padding:4rem;color:var(--muted);font-size:14px}

/* STYLE MODAL */
.style-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:300;
}
.style-modal.open{display:flex}
.modal-inner{
  background:#fff;
  max-width:520px;
  width:90%;
  padding:28px;
  border-radius:6px;
  position:relative;
  font-family:'DM Sans',sans-serif;
}
.modal-inner img{width:100%;margin-bottom:16px;border-radius:3px}
.modal-inner h2{margin-bottom:10px;font-size:20px}
.modal-inner p{font-size:14px;line-height:1.6;margin-bottom:10px;color:#444}
.modal-desc-text{font-size:14px;line-height:1.65;color:#555;margin-bottom:16px}
.modal-featuring{margin-top:14px}
.modal-featuring-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#b8956a;font-weight:500;margin-bottom:10px}
.artist-chips{display:flex;flex-wrap:wrap;gap:6px}
.artist-chip{
  display:inline-block;
  background:#f7f6f2;
  border:0.5px solid #e2e0d8;
  border-radius:20px;
  padding:5px 11px;
  font-size:12px;
  color:#1c1b18;
  font-family:'DM Sans',sans-serif;
  white-space:nowrap;
}
.modal-close{
  position:absolute;
  top:10px;
  right:12px;
  background:none;
  border:none;
  font-size:22px;
  cursor:pointer;
}
.modal-play{
  margin-top:10px;
  background:var(--gold);
  color:#fff;
  border:none;
  padding:10px 16px;
  border-radius:4px;
  cursor:pointer;
}
.modal-play:hover{background:var(--gold-dark)}

</style>
</head>
<body>

<nav class="nav">

<div class="hero">

  <h1 class="headline">Curated sound for every kind of space.</h1>

</div>

<div class="controls-wrap">
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M14.5 14.5l3 3"/></svg>

</div>

<script>
const GENRES = {
  Pop:    ['pop','chart','bright','sunny','taylor','lite pop','bubblegum'],
  Rock:   ['rock','punk','grunge','metal','alt rock','indie rock','yacht','power','modern rock'],
  Country:['country','texas','americana'],
  Jazz:   ['jazz','smooth jazz','jazzy','blues','swingin','lounge','bistro','new orleans','bossa'],
  'R&B':  ['r&b','soul','hip hop','uptown','funk','vibe','funky'],
  Chill:  ['chill','lofi','lo-fi','electro lounge','ambient','indie vibes','over easy'],
  Spa:    ['spa','nature','zen','meditation','spirit','luna','sol','guitar','piano'],
  Decades:['60s','70s','80s','90s','2000s','10s','oldies','classic rock','classic country','classic r&b','kool'],
  Holiday:['holiday','christmas','winter songs','halloween','valentine','pumpkin','st. patrick','cinco','pride','seasonal'],
  Eclectic:['eclectic','shuffle','variety','island','reggae','latin','euro','french','italian','new orleans','jam band','classical','christian','sports','energy','alternative deep','adult rock','indie electro']
};

let allStyles = [];
let currentAudio = null;
let currentIdx = null;
let activeGenre = 'All';
let searchTerm = '';

function genreFor(name) {
  const n = name.toLowerCase();
  for (const [g, keys] of Object.entries(GENRES)) {
    if (keys.some(k => n.includes(k))) return g;
  }
  return 'Other';
}

function stripHtml(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.textContent || '';
}

const DATA = [{"name":"Blues","description":"<p>Soulful genre characterized by its expressive lyrics, emotional guitar riffs, and a sense of longing and resilience, from legendary blues greats to newer, modern artists. </p><p>Featuring: Muddy Waters, Eric Clapton, B.B. King, Mavis Staples, Buddy Guy, John Lee Hooker, Susan Tedeschi, Keb\u2019 Mo\u2019, Stevie Ray Vaughn, and Bonnie Raitt.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c88293aef193bd10d28f4.png"},{"name":"80s New Wave","description":"<p>An upbeat mix of \u201880s synth-pop and modern rock hits from iconic stars and one-hit wonders.</p><p>Featuring: The B-52\u2019s, Blondie, The Cars, The Cure, The Eurythmics, Howard Jones, The Go-Go\u2019s, New Order, Men At Work, and The Smiths.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c88293aef193bd10d28f2.png"},{"name":"Adult Rock Crossroads","description":"<p>A fusion of rock genres that spans classic rock, Americana, singer-songwriters, roots rock, and jam bands, from the mid-\u201960s to today. </p><p>Featuring: Eric Clapton, Alabama Shakes, Brandi Carlile, Grateful Dead, Wilco, Tom Petty, Bruce Springsteen, The Eagles, The Jayhawks, and Nathaniel Rateliff and The Night Sweats.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c88293aef193bd10d28f3.png"},{"name":"Chill Pop","description":"<p>Weaving of contemporary midtempo indie pop, R&amp;B, and chill electronic leaning music, with dreamy vocals and smooth synths. </p><p>Featuring: Billie Eilish, Khalid, SZA, Conan Gray, Halsey, Lana Del Rey, Two Door Cinema Club, The Weeknd, Sigrid, and Cautious Clay.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/67b75e4d633863000b6df363.jpg"},{"name":"Contemporary Christian","description":"<p>Inspirational contemporary Christian pop, rock, country, and alternative, from the \u201800s to today.</p><p>Featuring: Switchfoot, NEEDTOBREATHE, Jars of Clay, Almost, Carrie Underwood, For King and Country, Lauren Daigle, Michael W. Smith, Steven Curtis Chapman, and Britt Nicole.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c88293aef193bd10d28f5.png"},{"name":"Eclectic","description":"<p>A diverse blend of easygoing midtempo folk, pop, rock, indie, chill electronic, R&amp;B, reggae, and jazz from the \u201850s to today.</p><p>Featuring: Norah Jones, Amy Winehouse, Bob Marley, Charles Bradley, Death Cab For Cutie, Diana Krall, Jungle, Khruangbin, Mac DeMarco, and Nathaniel Rateliff & The Night Sweats.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882a3aef193bd10d28f9.jpg"},{"name":"Classical","description":"<p>Elegant instrumental overtures, concertos, sonatas and symphonies.</p><p>;Featuring: music composed by Bach, Mozart, Chopin, Debussy, Beethoven, Brahms, Stravinsky, Schubert, Tchaikovsky, and Vivaldi.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882a3aef193bd10d28f7.png"},{"name":"All 10s","description":"<p>The best music of the \u201810s from the top artists of the decade across pop, alternative, indie rock, Americana, Hip-Hop, and R&amp;B.</p><p>Featuring: Taylor Swift, One Direction, HAIM, Bruno Mars, Vampire Weekend, Ariana Grande, Rihanna, The 1975, Flo Rida, Mumford &amp; Sons, and The Weeknd.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/6824bd11633863000bf18df8.png"},{"name":"Chill Indie Vibes","description":"<p>Atmospheric, chill, and groovy, with elements of soul, funk, and surf rock, including both instrumentals and vocals. </p><p>Featuring: Khruangbin, Hermanos Gutierrez, La Lom, Ikebe Shakedown, Allah-Las, Arc De Soleil, Badbadnotgood, Goodge, El Michels Affair, and Glass Beams.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/68598c5e633863000a21c3ce.png"},{"name":"Holiday Blend","description":"<p>Celebrate the season by blending Holiday Oldies with Holiday Contemporary, a timeless mix of festive favorites from legendary pop, rock, R&B, and country artists. </p><p>Featuring: Taylor Swift, Coldplay, Straight No Chaser, Justin Bieber, Carole King, Jimmy Buffett, Martina McBride, N\u2019 Sync, Bing Crosby, and Wilson Phillips.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882a3aef193bd10d28fd.png"},{"name":"Smooth Jazz","description":"<p>A polished blend of easy listening with softer-sounding contemporary jazz and vocals, from the \u201870s to today.</p><p>Featuring: Sade, Al Jarreau, Boney James, Paul Hardcastle, Dave Koz, David Sanborn, Kenny G, George Benson, Norah Jones, and Lee Ritenour.</p>","image":"https://customchannels-style-samples.s3.amazonaws.com/images/Smooth%20Jazz%20n%20Vocals.jpg"},{"name":"Kool Oldies","description":"<p>Instantly recognizable songs and sounds from rock \u2018n\u2019 roll\u2019s innovators, with popular music that topped the charts from the \u201850s to the \u201870s.</p><p>Featuring: Aretha Franklin, The Beach Boys, The Beatles, Chuck Berry, Diana Ross and The Supremes, Elvis Presley, The Jackson 5, The Mamas and The Papas, Roy Orbison, and The Who.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882a3aef193bd10d2903.png"},{"name":"Pride Icons","description":"<p>Celebrate Pride with timeless tracks from legendary artists who shaped generations, from pop, rock, R&amp;B, country, and disco.</p><p>Featuring: Elton John, Cher, Beyonc\u00e9, David Bowie, Queen, Lady Gaga, George Michael, Madonna, Katy Perry, and Taylor Swift.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/6827524f633863000bd4aa63.png"},{"name":"Jazzy Vibes","description":"<p>Chill beats with a jazzy feel, modern electronic instrumentals.</p><p>Featuring: DJ Grumble, Dosi, Flo Badabum, Jazz Jousters, Konteks, Lenny B, Maple Syrup, Oilix, Thelonius Coltrane, and Xander.\r\n</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/67bdf733633863000bff1788.jpg"},{"name":"Holiday Contemporary","description":"<p>Celebrate the season with a timeless mix of festive contemporary holiday songs from pop, rock, R&B, and country artists, from the \u201890s to today.</p><p>Featuring: Mariah Carey, Wham!, Pentatonix, Kelly Clarkson, John Legend, Meghan Trainor, Train, Sia, Justin Bieber, and Teddy Swims.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882c3aef193bd10d2918.png"},{"name":"Jazz","description":"<p>Traditional and popular jazz, including vocals and instrumentals, with improvisation, rhythm, harmony, and call-and-response techniques, from the \u201830s to today.</p><p>Featuring: Miles Davis, Chet Baker, Diana Krall, Billie Holiday, Frank Sinatra, Duke Ellington, Ella Fitzgerald, Harry Connick, Jr., McCoy Tyner, and Herbie Hancock.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882a3aef193bd10d28ff.png"},{"name":"Shuffle Variety","description":"<p>A dynamic playlist blending various genres into one exciting mix with a lineup of pop and rock, from the \u201860s to today. </p><p>Featuring: Maroon 5, Elton John, Stevie Wonder, Madonna, The Beatles, Taylor Swift, ABBA, Rod Stewart, Bruno Mars, and Bruce Springsteen.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882a3aef193bd10d2905.png"},{"name":"Indie Rock","description":"<p>Genre-defining indie-rock artists from the late \u201880s to today.</p><p>Featuring: Feist, LCD Soundsystem, MGMT, Modest Mouse, St. Vincent, Radiohead, Pixies, Santigold, The Strokes, and TV On The Radio.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882a3aef193bd10d28fe.jpg"},{"name":"Modern Rock","description":"<p>The current sounds of mainstream modern rock spun kson 5, and Elvis Presley.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882c3aef193bd10d2919.png"},{"name":"Spa Sol","description":"<p>Tranquil and gentle melodic instrumental music featuring piano and woodwinds, evoking the serene beauty of a sunrise. (No drums).</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882b3aef193bd10d2911.jpg"},{"name":"Bright Mix","description":"<p>A vibrant blend of midtempo adult contemporary singles and deep cuts from pop, rock, Americana, alternative, new wave, and R&amp;B, from the \u201880s to today. </p><p>Featuring: Adele, Andy Grammar, Ed Sheeran, Haim, Imagine Dragons, Jack Johnson, Leon Bridges, Train, The Police, Talking Heads, and Tracy Chapman.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882b3aef193bd10d2912.png"},{"name":"Alt Rock Now & Then","description":"<p>Icons of college radio, pop-punk, Britpop, modern rock, and grunge come together to create the ultimate alternative rock channel, from the late \u201870s to today.</p><p>Featuring: Nirvana, Arctic Monkeys, Beck, Blur, The Cure, The Cranberries, Florence and the Machine, Garbage, Jimmy Eat World, and The Replacements.</p>","image":"https://customchannels-style-samples.s3.amazonaws.com/images/Alt%20Rock%20NT.jpg"},{"name":"St. Patrick's Day","description":"<p>Irish artists and Celtic sounds to celebrate St. Patrick\u2019s Day.</p><p>;Featuring: The Pogues, The Chieftains, The Proclaimers, Celtic Woman, Clannad, The Irish Rovers, Great Big Sea, Two Tap Trio, Eileen Ivers, and Gaelic Storm.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882c3aef193bd10d291e.png"},{"name":"Island Time","description":"<p>Tropical island flavors, laid back, relaxed, and chill, with traditional and contemporary songs intermixed, from the \u201860s to today.</p><p>Featuring: Jimmy Buffett, Jack Johnson, Eddie Vedder, Bob Mar h, Jazzinuff, moow, Nujabes, Iamalex, Idealism, SoulChef, Konteks, Brockbeats, and Re um.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882d3aef193bd10d2932.png"},{"name":"Soft Classic Rock","description":"<p>Classic rock\u2019s lighter side, midtempo hit singles and album cuts from the era\u2019s icons, from the \u201860s to the \u201890s.</p><p>Featuring: America, Billy Joel, Bonnie Raitt, Carly Simon, Chicago, Elton John, James Taylor, Journey, Rod Stewart, and Steely Dan.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5c5c882a3aef193bd10d2907.png"},{"name":"Holiday Bright Mix","description":"<p>Ease into the season with a delightful blend of adult contemporary hits and festive holiday favorites, from the \u201880s to today. </p><p>Featuring: Gwen Stefani, Mariah Carey, Gavin DeGraw, OneRepublic, Colbie Caillat, Michael Bubl\u00e9, Ingrid Michaelson, Sarah McLachlan, The Pretenders, and Lady A.</p>","image":"https://s3-us-west-2.amazonaws.com/customchannels-style-samples/images/5f777f16daeb355ed939669f.png"}];

function init() {
  // Try live fetch first, fall back to embedded data
  fetch('https://customchannels.s3.amazonaws.com/remix_styles.json')
    .then(r => r.json())
    .then(data => {
      allStyles = data.map((s,i) => ({
        idx: i,
        name: s.display_name || s.name,
        description: (s.description && s.description.includes('Featuring'))
          ? s.description
          : (DATA.find(d => d.name === (s.display_name || s.name))?.description || s.description || ''),
        image: s.image_url || s.image || '',
        sample: s.sample_path ? 'https://customchannels-style-samples.s3.amazonaws.com/' + s.sample_path : null,
        _genre: genreFor(s.display_name || s.name || '')
      }));
      buildPage();
    })
    .catch(() => {
      // Fall back to embedded styles.json (no audio samples)
      allStyles = DATA.map((s,i) => ({
        idx: i,
        name: s.name,
        description: (s.description && s.description.includes('Featuring'))
          ? s.description
          : (DATA.find(d => d.name === (s.display_name || s.name))?.description || s.description || ''),
        image: s.image || '',
        sample: null,
        _genre: genreFor(s.name || '')
      }));
      buildPage();
    });
}

function buildPage() {
  buildPills();
  renderGrid();
}

function buildPills() {
  const counts = {All: allStyles.length};
  allStyles.forEach(s => { counts[s._genre] = (counts[s._genre]||0)+1; });
  const order = ['All','Pop','Rock','Country','Jazz','R&B','Chill','Spa','Decades','Holiday','Eclectic','Other'];
  const container = document.getElementById('filterPills');
  container.innerHTML = '';
  order.filter(g => counts[g]).forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'pill' + (g==='All'?' active':'');
    btn.textContent = g + (g!=='All' ? ' (' + counts[g] + ')' : '');
    btn.onclick = () => {
      activeGenre = g;
      document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    };
    container.appendChild(btn);
  });
}

function renderGrid() {
  const q = searchTerm.toLowerCase();
  const filtered = allStyles.filter(s => {
    const matchGenre = activeGenre==='All' || s._genre===activeGenre;
    const matchSearch = !q || s.name.toLowerCase().includes(q) || stripHtml(s.description).toLowerCase().includes(q);
    return matchGenre && matchSearch;
  });

  document.getElementById('countLabel').textContent = filtered.length + ' channels';

  const grid = document.createElement('div');
  grid.className = 'grid';

  filtered.forEach(s => {
    const isPlaying = currentIdx === s.idx;
    const hasAudio = !!s.sample;
    const card = document.createElement('div');
    card.onclick = () => openModal(s.idx);
    card.className = 'card' + (isPlaying?' is-playing':'') + (!hasAudio?' no-sample':'');
    card.id = 'card-' + s.idx;

    const btnContent = isPlaying
      ? '<div class="pause-bars"><span></span><span></span></div>'
      : '<div class="play-icon"></div>';

    card.innerHTML = `
      <div class="art-wrap">
        <img class="art" src="${s.image}" alt="${s.name}" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="overlay">
          <button class="play-btn" onclick="event.stopPropagation(); togglePlay(${s.idx})" title="${hasAudio?'Play sample':'No sample available'}">${btnContent}</button>
        </div>
      </div>
      <div class="card-info">
        <div class="card-name">${s.name}</div>
        <div class="card-desc">${stripHtml(descriptionPreview(s.description))}</div>
      </div>`;
    grid.appendChild(card);
  });

  const container = document.getElementById('gridContainer');
  container.innerHTML = '';
  container.appendChild(grid);
}

function togglePlay(idx) {
  const s = allStyles.find(x => x.idx === idx);
  if (!s || !s.sample) return;

  if (currentIdx === idx) { stopAll(); return; }

  stopAll(true);

  currentAudio = new Audio(s.sample);
  currentIdx = idx;
  currentAudio.play();
  currentAudio.onended = () => stopAll();

  document.getElementById('nowArt').src = s.image;
  document.getElementById('nowName').textContent = s.name;
  document.getElementById('nowTag').textContent = s._genre + ' · Now playing';
  document.getElementById('nowBar').classList.add('visible');

  renderGrid();
}

function stopAll(silent) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  currentIdx = null;
  if (!silent) {
    document.getElementById('nowBar').classList.remove('visible');
    renderGrid();
  }
}

function filterCards() {
  searchTerm = document.getElementById('searchInput').value;
  renderGrid();
}



function descriptionPreview(desc){
  if(!desc) return '';
  const match = desc.match(/<p>(.*?)<\/p>/i);
  if(match) return match[0];
  return desc;
}

function formatArtists(desc){
  if(!desc) return '';
  const tmp = document.createElement('div');
  tmp.innerHTML = desc;
  const paras = tmp.querySelectorAll('p');
  
  let descText = '';
  let artists = [];
  
  paras.forEach(p => {
    const text = p.textContent.trim();
    if(/Featuring:/i.test(text)){
      const raw = text.replace(/^[;\s]*Featuring:\s*/i,'');
      artists = raw.split(',').map(a => a.trim().replace(/^and /, '').replace(/\.$/, '').trim()).filter(Boolean);
    } else if(text) {
      descText = text;
    }
  });
  
  let out = '';
  if(descText) out += '<p class="modal-desc-text">' + descText + '</p>';
  if(artists.length){
    out += '<div class="modal-featuring"><div class="modal-featuring-label">Featuring</div>';
    out += '<div class="artist-chips">' + artists.map(a => '<span class="artist-chip">' + a + '</span>').join('') + '</div></div>';
  }
  return out;
}

function openModal(idx){
  const s = allStyles.find(x => x.idx === idx);
  if(!s) return;

  document.getElementById('modalArt').src = s.image;
  document.getElementById('modalTitle').textContent = s.name;
  
document.getElementById('modalDesc').innerHTML = formatArtists(s.description);


  document.getElementById('modalPlay').onclick = () => togglePlay(idx);

  document.getElementById('styleModal').classList.add('open');
}

function closeModal(){
  document.getElementById('styleModal').classList.remove('open');
}




init();
</script>

<div class="style-modal" id="styleModal" onclick="closeModal()">
  <div class="modal-inner" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">×</button>
    <img id="modalArt" src="">
    <h2 id="modalTitle"></h2>
    <div id="modalDesc"></div>
    <button class="modal-play" id="modalPlay">Play Sample</button>
  </div>
</div>
