<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opus – Charts</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --primary:#2c3e50;--secondary:#34495e;--accent:#3498db;
      --success:#27ae60;--warning:#f39c12;--danger:#e74c3c;
      --light:#ecf0f1;--border:#bdc3c7;
      --in-lib:#27ae60;--not-lib:#e74c3c;
    }
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f6fa;color:var(--primary);line-height:1.4}

    /* ── HEADER ── */
    .opus-header{background:var(--secondary);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2)}
    .opus-title{font-weight:800;font-size:16px}
    .opus-nav{display:flex;gap:14px}
    .nav-item{color:#bdc3c7;text-decoration:none;font-size:13px;font-weight:700;padding:8px 10px;border-radius:4px;transition:.2s}
    .nav-item:hover{color:#fff;background:rgba(255,255,255,.08)}
    .nav-item.active{color:#fff;background:var(--accent)}

    /* ── TOOLBAR ── */
    .opus-toolbar{background:#3d4f5e;padding:10px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #2c3e50;flex-wrap:wrap}
    .toolbar-label{color:#9fb3c8;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
    .toolbar-select{padding:7px 11px;background:#2c3e50;color:#fff;border:1.5px solid #4a6278;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer;min-width:160px}
    .toolbar-select:focus{outline:none;border-color:var(--accent)}
    .toolbar-select option{background:#2c3e50}
    .toolbar-divider{width:1px;height:28px;background:#4a6278;margin:0 4px}
    .load-btn{padding:7px 18px;background:var(--accent);color:#fff;border:none;border-radius:5px;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.2s;white-space:nowrap}
    .load-btn:hover{background:#2980b9}
    .load-btn:disabled{opacity:.5;cursor:not-allowed}
    .spinner{width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
    .load-btn.loading .spinner{display:block}
    .load-btn.loading .btn-label{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}

    .stats-pill{margin-left:auto;display:flex;gap:8px}
    .pill{padding:4px 11px;border-radius:12px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:5px}
    .pill-green{background:rgba(39,174,96,.2);color:#27ae60;border:1px solid rgba(39,174,96,.3)}
    .pill-red{background:rgba(231,76,60,.2);color:#e74c3c;border:1px solid rgba(231,76,60,.3)}
    .pill-dot{width:6px;height:6px;border-radius:50%}
    .pill-green .pill-dot{background:#27ae60}
    .pill-red .pill-dot{background:#e74c3c}

    /* ── CONTAINER ── */
    .container{max-width:1100px;margin:0 auto;padding:20px}

    /* ── EMPTY / ERROR STATE ── */
    .state-card{background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:60px 24px;text-align:center;color:#7f8c8d}
    .state-icon{font-size:48px;margin-bottom:12px}
    .state-title{font-size:18px;font-weight:800;margin-bottom:6px;color:var(--primary)}
    .state-sub{font-size:13px}

    /* ── CHART HEADER ── */
    .chart-header{background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:16px 22px;margin-bottom:16px;display:flex;align-items:center;gap:16px}
    .chart-platform-logo{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .chart-info{flex:1}
    .chart-name{font-size:17px;font-weight:900}
    .chart-meta{font-size:12px;color:#7f8c8d;margin-top:2px}
    .chart-updated{font-size:11px;color:#bdc3c7;margin-left:auto;font-weight:700;white-space:nowrap}

    /* ── TRACK LIST ── */
    .track-list{display:flex;flex-direction:column;gap:8px}

    .track-row{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:12px 16px;display:grid;grid-template-columns:44px 52px 1fr auto;gap:12px;align-items:center;transition:.15s;border:1.5px solid transparent}
    .track-row:hover{box-shadow:0 3px 12px rgba(0,0,0,.12);border-color:var(--border)}
    .track-row.in-library{border-left:3px solid var(--success)}
    .track-row.not-in-library{border-left:3px solid #ddd}

    .rank{font-size:18px;font-weight:900;color:#bdc3c7;text-align:center;font-variant-numeric:tabular-nums}
    .rank.top3{color:var(--primary)}

    .track-art{width:52px;height:52px;border-radius:6px;object-fit:cover;background:#ecf0f1;flex-shrink:0}
    .track-art-placeholder{width:52px;height:52px;border-radius:6px;background:linear-gradient(135deg,#ecf0f1,#d5d8dc);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}

    .track-info{min-width:0}
    .track-title{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .track-artist{font-size:12px;color:#7f8c8d;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .track-isrc{font-size:10px;font-family:monospace;color:#bdc3c7;margin-top:3px}

    .track-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}

    .status-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
    .status-badge.in-lib{background:rgba(39,174,96,.12);color:#27ae60;border:1px solid rgba(39,174,96,.25)}
    .status-badge.not-lib{background:rgba(189,195,199,.15);color:#95a5a6;border:1px solid #ddd}

    .add-btn{padding:7px 14px;background:var(--success);color:#fff;border:none;border-radius:5px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;transition:.2s;display:flex;align-items:center;gap:6px}
    .add-btn:hover{background:#219a52}
    .add-btn:disabled{opacity:.5;cursor:not-allowed}

    .amazon-btn{padding:7px 12px;background:#ff9900;color:#fff;border:none;border-radius:5px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:.2s}
    .amazon-btn:hover{background:#e88a00}

    /* ── PLAYLIST MODAL ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
    .modal-overlay.open{opacity:1;pointer-events:all}
    .modal{background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:440px;max-width:94vw;max-height:80vh;display:flex;flex-direction:column;transform:translateY(12px);transition:.2s}
    .modal-overlay.open .modal{transform:translateY(0)}
    .modal-header{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .modal-title{font-size:15px;font-weight:900}
    .modal-track{font-size:12px;color:#7f8c8d;margin-top:3px}
    .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#7f8c8d;line-height:1;padding:2px;flex-shrink:0}
    .modal-close:hover{color:var(--primary)}
    .modal-search{padding:10px 16px;border-bottom:1px solid var(--border)}
    .modal-search input{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:5px;font-size:13px}
    .modal-search input:focus{outline:none;border-color:var(--accent)}
    .playlist-list{overflow-y:auto;flex:1;padding:8px}
    .playlist-item{padding:10px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:.15s}
    .playlist-item:hover{background:var(--light)}
    .playlist-item.adding{opacity:.5;pointer-events:none}
    .pl-name{font-size:13px;font-weight:700}
    .pl-meta{font-size:11px;color:#7f8c8d;margin-top:1px}
    .pl-add-icon{font-size:18px;color:#bdc3c7;transition:.15s}
    .playlist-item:hover .pl-add-icon{color:var(--success)}
    .modal-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:#7f8c8d;text-align:center}

    /* ── TOAST ── */
    .toast-container{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .toast{padding:11px 16px;border-radius:7px;color:#fff;font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.2);transform:translateX(120%);transition:.3s;pointer-events:none}
    .toast.show{transform:translateX(0)}
    .toast.success{background:#27ae60}
    .toast.error{background:#e74c3c}
    .toast.info{background:#3498db}

    /* ── LOADING SKELETON ── */
    .skeleton-row{background:#fff;border-radius:8px;padding:12px 16px;display:grid;grid-template-columns:44px 52px 1fr auto;gap:12px;align-items:center;margin-bottom:8px}
    .skel{background:linear-gradient(90deg,#ecf0f1 25%,#d5d8dc 50%,#ecf0f1 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:4px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="opus-header">
  <span class="opus-title">⚡ OPUS</span>
  <nav class="opus-nav">
    <a class="nav-item" href="http://opus.customchannels.net/">Tracks</a>
    <a class="nav-item" href="./api-docs.html">API Docs</a>
    <a class="nav-item" href="./index.html">Playback Classes</a>
    <a class="nav-item" href="./curator-dashboard.html">Curator Dashboard</a>
    <a class="nav-item" href="./mood-tagging.html">Mood Tagging</a>
    <a class="nav-item" href="./playlist-matcher.html">Spotchecker</a>
    <a class="nav-item" href="./spotify-sync.html">Spotify Sync</a>
    <a class="nav-item" href="./dna-compare.html">DNA Compare</a>
    <a class="nav-item" href="./style-builder.html">Style Builder</a>

  </nav>
</header>

<!-- ═══ TOOLBAR ═══ -->
<div class="opus-toolbar">
  <span class="toolbar-label">Platform</span>
  <select class="toolbar-select" id="platformSelect">
    <option value="spotify">Spotify</option>
  </select>

  <div class="toolbar-divider"></div>
  <span class="toolbar-label">Chart</span>
  <select class="toolbar-select" id="chartSelect">
    <option value="">Select platform first...</option>
  </select>

  <div class="toolbar-divider"></div>
  <button class="load-btn" id="loadBtn" onclick="loadChart()">
    <div class="spinner"></div>
    <span class="btn-label">Load Chart</span>
  </button>

  <div class="stats-pill" id="statsPill" style="display:none">
    <span class="pill pill-green"><span class="pill-dot"></span><span id="statIn">0</span> in library</span>
    <span class="pill pill-red"><span class="pill-dot"></span><span id="statOut">0</span> not available</span>
  </div>
</div>

<!-- ═══ MAIN ═══ -->
<div class="container">
  <div id="mainContent">
    <div class="state-card">
      <div class="state-icon">📊</div>
      <div class="state-title">Select a chart to get started</div>
      <div class="state-sub">Choose a platform and chart from the toolbar above</div>
    </div>
  </div>
</div>

<!-- ═══ PLAYLIST MODAL ═══ -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title">Add to Playlist</div>
        <div class="modal-track" id="modalTrackName"></div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-search">
      <input type="text" id="playlistSearch" placeholder="Search playlists..." oninput="filterPlaylists()" />
    </div>
    <div class="playlist-list" id="playlistList"></div>
    <div class="modal-footer" id="modalFooter">Loading playlists...</div>
  </div>
</div>

<!-- ═══ TOASTS ═══ -->
<div class="toast-container" id="toastContainer"></div>

<script src="./config.js"></script>
<script src="./api-client.js"></script>
<script>
// ─────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────

// Strip trailing /v1 if present — routes already include /v1 prefix
const API_BASE = (typeof OPUS_CONFIG !== 'undefined' && OPUS_CONFIG.API_BASE_URL)
  ? OPUS_CONFIG.API_BASE_URL.replace(/\/$/, '').replace(/\/v1$/, '')
  : 'https://opus-platform.onrender.com';

const API_KEY = (typeof OPUS_CONFIG !== 'undefined')
  ? (OPUS_CONFIG.OPUS_INTERNAL_API_KEY || OPUS_CONFIG.API_KEY || '')
  : '';

const SC_PROXY = `${API_BASE}/v1/soundcharts`;

// Soundcharts chart slugs per platform
const CHART_OPTIONS = {
  spotify: [
    // ── National ──
    { slug: 'global-1',       name: '🌍 Top Songs — Global' },
    { slug: 'top-songs-68',   name: '🇺🇸 Top Songs — US' },
    { slug: 'most-viral-1',   name: '🔥 Viral Songs — US' },
    // ── US Cities ──
    { slug: 'top-new-york-city',   name: 'Top — New York City' },
    { slug: 'top-los-angeles',     name: 'Top — Los Angeles' },
    { slug: 'top-chicago',         name: 'Top — Chicago' },
    { slug: 'top-houston',         name: 'Top — Houston' },
    { slug: 'top-miami',           name: 'Top — Miami' },
    { slug: 'top-dallas',          name: 'Top — Dallas' },
    { slug: 'top-atlanta',         name: 'Top — Atlanta' },
    { slug: 'top-san-francisco',   name: 'Top — San Francisco' },
    { slug: 'top-seattle',         name: 'Top — Seattle' },
    { slug: 'top-nashville',       name: 'Top — Nashville' },
    { slug: 'top-austin',          name: 'Top — Austin' },
    { slug: 'top-phoenix',         name: 'Top — Phoenix' },
    { slug: 'top-denver',          name: 'Top — Denver' },
    { slug: 'top-philadelphia',    name: 'Top — Philadelphia' },
    { slug: 'top-washington',      name: 'Top — Washington DC' },
    { slug: 'top-boston',          name: 'Top — Boston' },
    { slug: 'top-detroit',         name: 'Top — Detroit' },
    { slug: 'top-minneapolis',     name: 'Top — Minneapolis' },
    { slug: 'top-portland',        name: 'Top — Portland' },
    { slug: 'top-san-diego',       name: 'Top — San Diego' },
    { slug: 'top-las-vegas',       name: 'Top — Las Vegas' },
    { slug: 'top-charlotte',       name: 'Top — Charlotte' },
    { slug: 'top-san-antonio',     name: 'Top — San Antonio' },
    { slug: 'top-tampa',           name: 'Top — Tampa' },
    { slug: 'top-new-orleans',     name: 'Top — New Orleans' },
    { slug: 'top-pittsburgh',      name: 'Top — Pittsburgh' },
    { slug: 'top-st-louis',        name: 'Top — St. Louis' },
    { slug: 'top-salt-lake-city',  name: 'Top — Salt Lake City' },
    { slug: 'top-sacramento',      name: 'Top — Sacramento' },
    { slug: 'top-omaha',           name: 'Top — Omaha' },
    { slug: 'top-indianapolis',    name: 'Top — Indianapolis' },
    { slug: 'top-cleveland',       name: 'Top — Cleveland' },
    { slug: 'top-memphis',         name: 'Top — Memphis' },
    { slug: 'top-san-juan',        name: 'Top — San Juan' },
  ],
};  // apple_music and tiktok pending plan upgrade

const PLATFORM_LABELS = {
  spotify: { emoji: '🟢', name: 'Spotify' },
};

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────

let allPlaylists = [];
let currentSongId = null;
let currentSongLabel = null;
let currentChartTracks = [];

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────

document.getElementById('platformSelect').addEventListener('change', function() {
  populateChartSelect(this.value);
});

populateChartSelect('spotify');
loadPlaylists();

function populateChartSelect(platform) {
  const sel = document.getElementById('chartSelect');
  const charts = CHART_OPTIONS[platform] || [];
  sel.innerHTML = charts.length
    ? charts.map(c => `<option value="${c.slug}">${c.name}</option>`).join('')
    : '<option value="">No charts available</option>';
}

// ─────────────────────────────────────────────
// SOUNDCHARTS PROXY CALL
// ─────────────────────────────────────────────

async function scProxy(path) {
  const res = await fetch(`${SC_PROXY}?path=${encodeURIComponent(path)}`, {
    headers: { 'x-api-key': API_KEY }
  });
  if (!res.ok) throw new Error(`SC proxy ${res.status}`);
  return res.json();
}

// ─────────────────────────────────────────────
// LOAD CHART
// ─────────────────────────────────────────────

async function loadChart() {
  const platform  = document.getElementById('platformSelect').value;
  const chartSlug = document.getElementById('chartSelect').value;
  if (!chartSlug) { toast('Select a chart first', 'error'); return; }

  const btn = document.getElementById('loadBtn');
  btn.classList.add('loading');
  btn.disabled = true;

  document.getElementById('mainContent').innerHTML = renderSkeletons(20);
  document.getElementById('statsPill').style.display = 'none';

  try {
    // 1. Fetch latest ranking from Soundcharts (paginate to get all tracks)
    const rankData = await scProxy(`/api/v2.14/chart/song/${chartSlug}/ranking/latest?limit=100&offset=0`);
    let items = rankData?.items || [];
    const total = rankData?.page?.total || items.length;

    // Fetch remaining pages if chart has more than 100 tracks
    if (total > 100) {
      const extraPages = Math.ceil((total - 100) / 100);
      for (let p = 1; p <= extraPages; p++) {
        const more = await scProxy(`/api/v2.14/chart/song/${chartSlug}/ranking/latest?limit=100&offset=${p * 100}`);
        if (more?.items?.length) items = items.concat(more.items);
      }
    }

    if (!items.length) {
      document.getElementById('mainContent').innerHTML = `
        <div class="state-card">
          <div class="state-icon">🔍</div>
          <div class="state-title">No chart data found</div>
          <div class="state-sub">This chart may not have recent data available</div>
        </div>`;
      return;
    }

    // 2. Extract Soundcharts UUIDs and check library in bulk
    const scUuids = items.map(item => item.song?.uuid).filter(Boolean);
    const libraryMap = await checkLibraryBatchByUUID(scUuids);

    // 3. Render
    currentChartTracks = items;
    renderChart(platform, chartSlug, items, libraryMap, rankData?.related || {});

  } catch (e) {
    console.error(e);
    document.getElementById('mainContent').innerHTML = `
      <div class="state-card">
        <div class="state-icon">⚠️</div>
        <div class="state-title">Failed to load chart</div>
        <div class="state-sub">${e.message}</div>
      </div>`;
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

// ─────────────────────────────────────────────
// LIBRARY CHECK
// ─────────────────────────────────────────────

async function checkLibraryBatchByUUID(scUuids) {
  if (!scUuids.length) return {};
  try {
    const res = await fetch(`${API_BASE}/v1/songs/check-sc-uuids`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
      body: JSON.stringify({ sc_uuids: scUuids })
    });
    if (!res.ok) return {};
    const data = await res.json();
    // Expects { results: { [sc_uuid]: { inLibrary: bool, songId, title, artist, isrc } } }
    return data.results || {};
  } catch {
    return {};
  }
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────

function renderChart(platform, slug, items, libraryMap, related) {
  const pl = PLATFORM_LABELS[platform] || { emoji: '📊', name: platform };
  const chartName = CHART_OPTIONS[platform]?.find(c => c.slug === slug)?.name || slug;
  const updatedAt = related?.date || '';

  let inLib = 0, notLib = 0;
  items.forEach(item => {
    const isrc = item.song?.isrc || item.isrc;
    if (libraryMap[isrc]?.inLibrary) inLib++; else notLib++;
  });

  document.getElementById('statIn').textContent  = inLib;
  document.getElementById('statOut').textContent = notLib;
  document.getElementById('statsPill').style.display = 'flex';

  const rows = items.map((item, idx) => {
    const rank    = item.position ?? item.rank ?? (idx + 1);
    const song    = item.song || item;
    const scUuid  = song.uuid || '';
    const isrc    = song.isrc || '';
    const title   = song.name || song.title || 'Unknown';
    const artist  = song.creditName || (song.artists?.[0]?.name) || song.artist || '';
    const imgUrl  = song.imageUrl || '';
    const lib     = libraryMap[scUuid] || libraryMap[isrc] || {};
    const inLibrary = !!lib.inLibrary;
    const songId  = lib.songId || null;
    const rankClass = rank <= 3 ? 'top3' : '';
    const rowClass  = inLibrary ? 'in-library' : 'not-in-library';

    const artEl = imgUrl
      ? `<img class="track-art" src="${imgUrl}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const artPlaceholder = `<div class="track-art-placeholder" style="${imgUrl ? 'display:none' : ''}">🎵</div>`;

    const amazonQ  = encodeURIComponent(`${title} ${artist}`);
    const amazonUrl = `https://www.amazon.com/s?k=${amazonQ}&i=digital-music`;

    const actionBtn = inLibrary
      ? `<button class="add-btn" onclick="openModal('${songId}','${escHtml(title)} — ${escHtml(artist)}')">＋ Add to Playlist</button>`
      : `<a class="amazon-btn" href="${amazonUrl}" target="_blank" rel="noopener">🛒 Buy on Amazon</a>`;

    const badge = inLibrary
      ? `<span class="status-badge in-lib">In Library</span>`
      : `<span class="status-badge not-lib">Not Available</span>`;

    return `
      <div class="track-row ${rowClass}">
        <div class="rank ${rankClass}">${rank}</div>
        <div style="position:relative">
          ${artEl}${artPlaceholder}
        </div>
        <div class="track-info">
          <div class="track-title">${escHtml(title)}</div>
          <div class="track-artist">${escHtml(artist)}</div>
          ${isrc ? `<div class="track-isrc">${isrc}</div>` : ''}
        </div>
        <div class="track-actions">
          ${badge}
          ${actionBtn}
        </div>
      </div>`;
  }).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="chart-header">
      <div class="chart-platform-logo">${pl.emoji}</div>
      <div class="chart-info">
        <div class="chart-name">${pl.name} — ${chartName}</div>
        <div class="chart-meta">${items.length} tracks</div>
      </div>
      ${updatedAt ? `<div class="chart-updated">Updated ${updatedAt.slice(0,10)}</div>` : ''}
    </div>
    <div class="track-list">${rows}</div>`;
}

function renderSkeletons(n) {
  return Array.from({length: n}, (_, i) => `
    <div class="skeleton-row">
      <div class="skel" style="width:32px;height:22px"></div>
      <div class="skel" style="width:52px;height:52px;border-radius:6px"></div>
      <div>
        <div class="skel" style="width:${160 + (i % 3)*40}px;height:14px;margin-bottom:7px"></div>
        <div class="skel" style="width:${90 + (i % 4)*20}px;height:11px"></div>
      </div>
      <div class="skel" style="width:110px;height:32px;border-radius:5px"></div>
    </div>`).join('');
}

// ─────────────────────────────────────────────
// PLAYLIST MODAL
// ─────────────────────────────────────────────

async function loadPlaylists() {
  try {
    const res = await fetch(`${API_BASE}/v1/playlists`, {
      headers: { 'x-api-key': API_KEY }
    });
    if (!res.ok) return;
    const data = await res.json();
    allPlaylists = data.playlists || data.data || data || [];
  } catch { allPlaylists = []; }
}

function openModal(songId, label) {
  currentSongId    = songId;
  currentSongLabel = label;
  document.getElementById('modalTrackName').textContent = label;
  document.getElementById('playlistSearch').value = '';
  renderPlaylistList(allPlaylists);
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
  currentSongId = null;
}

function filterPlaylists() {
  const q = document.getElementById('playlistSearch').value.toLowerCase();
  const filtered = allPlaylists.filter(p => (p.name || '').toLowerCase().includes(q));
  renderPlaylistList(filtered);
}

function renderPlaylistList(playlists) {
  const footer = document.getElementById('modalFooter');
  if (!playlists.length) {
    document.getElementById('playlistList').innerHTML = '<div style="padding:24px;text-align:center;color:#7f8c8d;font-size:13px">No playlists found</div>';
    footer.textContent = '';
    return;
  }
  footer.textContent = `${playlists.length} playlist${playlists.length !== 1 ? 's' : ''}`;
  document.getElementById('playlistList').innerHTML = playlists.map(p => `
    <div class="playlist-item" onclick="addToPlaylist('${p.id || p.uuid}','${escHtml(p.name)}',this)">
      <div>
        <div class="pl-name">${escHtml(p.name)}</div>
        <div class="pl-meta">${p.trackCount ?? p.track_count ?? ''} ${(p.trackCount ?? p.track_count) != null ? 'tracks' : ''}</div>
      </div>
      <span class="pl-add-icon">＋</span>
    </div>`).join('');
}

async function addToPlaylist(playlistId, playlistName, el) {
  if (!currentSongId) return;
  el.classList.add('adding');
  try {
    const res = await fetch(`${API_BASE}/v1/playlists/${playlistId}/songs`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
      body: JSON.stringify({ song_id: currentSongId })
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.error?.message || 'Failed to add track');
    }
    toast(`Added to ${playlistName}`, 'success');
    closeModalDirect();
  } catch (e) {
    toast(e.message, 'error');
    el.classList.remove('adding');
  }
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  requestAnimationFrame(() => { requestAnimationFrame(() => el.classList.add('show')); });
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 350);
  }, 3000);
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
