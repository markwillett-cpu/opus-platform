<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISH × Opus Library Matcher</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --border: #2a2a2a;
    --accent: #c8a96e;
    --accent-dim: rgba(200,169,110,0.15);
    --green: #4ade80;
    --green-dim: rgba(74,222,128,0.12);
    --text: #e8e0d0;
    --muted: #666;
    --mono: 'DM Mono', monospace;
    --serif: 'Playfair Display', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    min-height: 100vh;
    padding: 40px 32px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 20px;
    margin-bottom: 36px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: 28px;
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .config-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }

  input[type="text"], input[type="password"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--accent);
  }

  input[type="text"].wide { width: 380px; }
  input[type="text"].key-input { width: 320px; }

  label {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  button {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-primary {
    background: var(--accent);
    color: #0e0e0e;
    font-weight: 500;
  }
  .btn-primary:hover { background: #d4b87a; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn-secondary:hover { background: var(--accent-dim); }
  .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: #444; }

  .stats-bar {
    display: flex;
    gap: 32px;
    margin-bottom: 20px;
    padding: 14px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .stat { display: flex; flex-direction: column; gap: 3px; }
  .stat-val {
    font-size: 22px;
    font-family: var(--serif);
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .stat-val.green { color: var(--green); }
  .stat-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .stat-sep {
    width: 1px;
    background: var(--border);
    align-self: stretch;
  }

  #status {
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--muted);
    min-height: 18px;
    letter-spacing: 0.03em;
  }

  .progress-bar {
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 1px;
    transition: width 0.3s ease;
    width: 0%;
  }

  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
  }

  .filter-btn {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .filter-btn:hover { color: var(--text); border-color: #444; }
  .filter-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  #search-input {
    width: 220px;
    margin-left: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  thead th {
    text-align: left;
    padding: 10px 12px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    font-weight: 400;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--accent); }

  tbody tr {
    border-bottom: 1px solid #1a1a1a;
    transition: background 0.1s;
  }
  tbody tr:hover { background: var(--surface); }

  td {
    padding: 9px 12px;
    vertical-align: middle;
  }

  td.title-cell { color: var(--text); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.artist-cell { color: #aaa; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.album-cell { color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.isrc-cell { color: var(--muted); font-size: 11px; letter-spacing: 0.05em; }
  td.duration-cell { color: var(--muted); text-align: right; }
  td.match-cell { text-align: center; }

  .match-badge {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
  }
  .match-exact { background: var(--green-dim); color: var(--green); border: 1px solid rgba(74,222,128,0.25); }
  .match-fuzzy { background: rgba(200,169,110,0.15); color: var(--accent); border: 1px solid rgba(200,169,110,0.25); }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .empty-state {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-style: italic;
  }

  .album-group-header {
    background: #111;
    padding: 8px 12px;
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .album-count {
    color: var(--muted);
    font-size: 10px;
  }

  .error-msg {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #f87171;
    padding: 10px 14px;
    border-radius: 4px;
    margin-bottom: 16px;
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>MISH × Opus</h1>
  <span class="subtitle">Library Coverage Report &nbsp;·&nbsp; Curated by Garth Trinidad</span>
</header>

<div class="config-row">
  <label>Supabase URL</label>
  <input type="text" class="wide" id="sb-url" value="https://quuxtalnpdcommlylwlp.supabase.co" placeholder="https://your-project.supabase.co" />
  <label>Anon Key</label>
  <input type="password" class="key-input" id="sb-key" placeholder="Paste your publishable/anon key" />
</div>

<div class="controls">
  <button class="btn-primary" id="run-btn" onclick="runSearch()">▶ Run Search</button>
  <button class="btn-secondary" id="sample-btn" onclick="buildSample()" disabled>✦ Build 500 Sample</button>
  <button class="btn-secondary" id="export-btn" onclick="exportCSV()" disabled>↓ Export Full CSV</button>
  <button class="btn-secondary" id="export-sample-btn" onclick="exportSampleCSV()" disabled>↓ Export Sample CSV</button>
  <button class="btn-ghost" onclick="clearResults()">✕ Clear</button>
  <button class="btn-secondary" id="spotify-auth-btn" onclick="spotifyLogin()" style="margin-left:auto; border-color:#1DB954; color:#1DB954;">⏵ Connect Spotify</button>
</div>

<div id="spotify-row" style="display:none; margin-bottom:16px; align-items:center; gap:12px; flex-wrap:wrap;" class="controls">
  <span id="spotify-user" style="font-size:12px; color:var(--muted);"></span>
  <button class="btn-secondary" id="push-playlist-btn" onclick="pushToSpotify()" disabled style="border-color:#1DB954; color:#1DB954;">⏵ Push to Spotify</button>
  <span id="spotify-status" style="font-size:12px; color:var(--muted);"></span>
</div>

<div id="error-area"></div>
<div id="status">Enter your Supabase anon key and click Run Search.</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

<div class="stats-bar" id="stats-bar" style="display:none">
  <div class="stat">
    <span class="stat-val" id="stat-total">0</span>
    <span class="stat-label">Albums in List</span>
  </div>
  <div class="stat-sep"></div>
  <div class="stat">
    <span class="stat-val green" id="stat-albums-matched">0</span>
    <span class="stat-label">Albums w/ Tracks</span>
  </div>
  <div class="stat-sep"></div>
  <div class="stat">
    <span class="stat-val green" id="stat-tracks">0</span>
    <span class="stat-label">Total Tracks Found</span>
  </div>
  <div class="stat-sep"></div>
  <div class="stat">
    <span class="stat-val" id="stat-coverage">0%</span>
    <span class="stat-label">Album Coverage</span>
  </div>
</div>

<div id="sample-panel" style="display:none; margin-bottom:20px;">
  <div class="stats-bar" id="sample-stats-bar" style="flex-wrap:wrap; gap:16px;">
    <div class="stat">
      <span class="stat-val green" id="sstat-hits">0</span>
      <span class="stat-label">Hits</span>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <span class="stat-val green" id="sstat-cuts">0</span>
      <span class="stat-label">Album Cuts</span>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <span class="stat-val" id="sstat-total">0</span>
      <span class="stat-label">Total Sample</span>
    </div>
    <div class="stat-sep"></div>
    <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center;" id="decade-breakdown"></div>
  </div>
</div>

<div class="filter-row" id="filter-row" style="display:none">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('matched', this)">Matched Albums Only</button>
  <button class="filter-btn" onclick="setFilter('missing', this)">Not in Library</button>
  <button class="filter-btn" id="filter-sample-btn" onclick="setFilter('sample', this)" style="display:none">500 Sample Only</button>
  <input type="text" id="search-input" placeholder="Filter by artist / album…" oninput="renderTable()" />
</div>

<div class="table-wrap" id="table-wrap">
  <div class="empty-state">Results will appear here after running the search.</div>
</div>

let allResults = [];
let currentFilter = 'all';
let sortCol = 'artist';
let sortDir = 1;

function normalize(s) {
  if (!s) return '';
  return s.toLowerCase()
    .replace(/[''`]/g, "'")
    .replace(/[^\w\s']/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Word-boundary safe: every word in `needle` must appear as a whole word in `haystack`
function wordsMatch(haystack, needle) {
  const words = needle.trim().split(/\s+/);
  return words.every(w => {
    if (!w) return true;
    const re = new RegExp('(?:^|\\s)' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:\\s|$)');
    return re.test(haystack);
  });
}

function artistMatch(libArtist, queryArtist) {
  const la = normalize(libArtist), qa = normalize(queryArtist);
  // Exact match
  if (la === qa) return true;
  // "The X" vs "X"
  const stripped = (s) => s.replace(/^the\s+/, '');
  if (stripped(la) === stripped(qa)) return true;
  // Multi-artist entries like "J Balvin, Bad Bunny" — check if query artist
  // appears as a whole-word token within the library artist string
  if (wordsMatch(la, qa)) return true;
  // Allow library "Herbie Hancock" to match query "Herbie Hancock" exactly —
  // but do NOT allow substring-only matches (no more "abba" in "black sabbath")
  return false;
}

function albumMatch(libAlbum, queryAlbum) {
  if (!libAlbum) return false;
  const la = normalize(libAlbum), qa = normalize(queryAlbum);
  // Wildcard entries — match any album by that artist
  if (qa === 'any album' || qa === 'collection' || qa === 'greatest hits' ||
      qa === 'best of' || qa === 'anthology') return true;
  // Exact match
  if (la === qa) return true;
  // Allow library album to contain the full query title (e.g. "The Miseducation of Lauryn Hill"
  // matching query "The Miseducation Of…") — but require whole-word containment, not substring
  if (la.includes(qa)) return true;
  // Query title contained in library title (e.g. query "Illmatic" in "Nas Illmatic")
  if (wordsMatch(la, qa)) return true;
  return false;
}

async function runSearch() {
  const sbUrl = document.getElementById('sb-url').value.trim();
  const sbKey = document.getElementById('sb-key').value.trim();

  if (!sbUrl || !sbKey) {
    showError('Please enter your Supabase URL and anon key.');
    return;
  }

  clearError();
  allResults = [];
  document.getElementById('run-btn').disabled = true;
  document.getElementById('export-btn').disabled = true;
  document.getElementById('stats-bar').style.display = 'none';
  document.getElementById('filter-row').style.display = 'none';

  const { createClient } = supabase;
  const client = createClient(sbUrl, sbKey);

  // Get unique artists to query
  const artists = [...new Set(MISH_ALBUMS.map(([a]) => a))];
  const total = artists.length;
  let done = 0;

  setStatus(`Querying library for ${total} artists…`);
  setProgress(0);

  // Fetch all matching songs in batches by artist
  const libraryMap = {}; // artist_norm -> rows[]

  for (let i = 0; i < artists.length; i += 10) {
    const batch = artists.slice(i, i + 10);
    try {
      for (const artist of batch) {
        const norm = normalize(artist);
        // Word-boundary OR filter: prevents "abba" matching "Black Sabbath", "war" matching "Howard" etc.
        const { data, error } = await client
          .from('library_songs')
          .select('id, title, artist, album, isrc, run_time_seconds, peak_year')
          .or(`artist.ilike.${norm},artist.ilike.${norm} %,artist.ilike.% ${norm},artist.ilike.% ${norm} %`)
          .limit(2000);

        if (!error && data) {
          if (!libraryMap[norm]) libraryMap[norm] = [];
          libraryMap[norm].push(...data);
        }
        done++;
      }
    } catch(e) {
      console.error(e);
    }
    setProgress(Math.round((done / total) * 80));
    setStatus(`Querying library… ${done}/${total} artists`);
    await sleep(50);
  }

  setStatus('Matching tracks to MISH list…');
  setProgress(85);

  // Now match each album entry
  for (const [queryArtist, queryAlbum] of MISH_ALBUMS) {
    const norm = normalize(queryArtist);
    const pool = libraryMap[norm] || [];

    const matchedTracks = pool.filter(row =>
      artistMatch(row.artist, queryArtist) && albumMatch(row.album, queryAlbum)
    );

    if (matchedTracks.length > 0) {
      for (const t of matchedTracks) {
        allResults.push({
          mish_artist: queryArtist,
          mish_album: queryAlbum,
          lib_artist: t.artist,
          lib_album: t.album || '',
          title: t.title,
          isrc: t.isrc || '',
          duration: t.run_time_seconds ? formatDuration(t.run_time_seconds) : '',
          peak_year: t.peak_year || '',
          match_type: normalize(t.album) === normalize(queryAlbum) ? 'exact' : 'fuzzy',
          id: t.id
        });
      }
    } else {
      allResults.push({
        mish_artist: queryArtist,
        mish_album: queryAlbum,
        lib_artist: '',
        lib_album: '',
        title: '',
        isrc: '',
        duration: '',
        peak_year: '',
        match_type: 'none',
        id: null
      });
    }
  }

  setProgress(100);

  const matched = allResults.filter(r => r.match_type !== 'none');
  const albumsMatched = new Set(allResults.filter(r => r.match_type !== 'none').map(r => r.mish_artist + '||' + r.mish_album)).size;
  const totalAlbums = MISH_ALBUMS.length;

  document.getElementById('stat-total').textContent = totalAlbums;
  document.getElementById('stat-albums-matched').textContent = albumsMatched;
  document.getElementById('stat-tracks').textContent = matched.length;
  document.getElementById('stat-coverage').textContent = Math.round(albumsMatched/totalAlbums*100) + '%';
  document.getElementById('stats-bar').style.display = 'flex';
  document.getElementById('filter-row').style.display = 'flex';

  setStatus(`Done. Found ${matched.length} tracks across ${albumsMatched} of ${totalAlbums} albums.`);
  document.getElementById('run-btn').disabled = false;
  document.getElementById('export-btn').disabled = false;
  document.getElementById('sample-btn').disabled = false;

  renderTable();
}

function renderTable() {
  const searchVal = normalize(document.getElementById('search-input')?.value || '');
  let rows = [...allResults];

  if (currentFilter === 'matched') rows = rows.filter(r => r.match_type !== 'none');
  if (currentFilter === 'missing') rows = rows.filter(r => r.match_type === 'none');
  if (currentFilter === 'sample') rows = rows.filter(r => r.sample_type);

  if (searchVal) {
    rows = rows.filter(r =>
      normalize(r.mish_artist).includes(searchVal) ||
      normalize(r.mish_album).includes(searchVal) ||
      normalize(r.title).includes(searchVal)
    );
  }

  // Sort
  rows.sort((a, b) => {
    let av = a[sortCol] || '', bv = b[sortCol] || '';
    return av.localeCompare(bv) * sortDir;
  });

  if (rows.length === 0) {
    document.getElementById('table-wrap').innerHTML = '<div class="empty-state">No results match the current filter.</div>';
    return;
  }

  let html = `<table>
    <thead><tr>
      <th onclick="sort('mish_artist')" class="${sortCol==='mish_artist'?'sorted':''}">Artist ↕</th>
      <th onclick="sort('mish_album')" class="${sortCol==='mish_album'?'sorted':''}">MISH Album ↕</th>
      <th onclick="sort('title')" class="${sortCol==='title'?'sorted':''}">Track Title ↕</th>
      <th onclick="sort('lib_album')" class="${sortCol==='lib_album'?'sorted':''}">Library Album ↕</th>
      <th onclick="sort('isrc')" class="${sortCol==='isrc'?'sorted':''}">ISRC ↕</th>
      <th onclick="sort('duration')" class="${sortCol==='duration'?'sorted':''}">Duration ↕</th>
      <th onclick="sort('peak_year')" class="${sortCol==='peak_year'?'sorted':''}">Year ↕</th>
      <th>Match</th>
      <th>Sample</th>
    </tr></thead><tbody>`;

  for (const r of rows) {
    const badge = r.match_type === 'exact'
      ? '<span class="match-badge match-exact">Exact</span>'
      : r.match_type === 'fuzzy'
      ? '<span class="match-badge match-fuzzy">Fuzzy</span>'
      : '<span style="color:#555;font-size:10px">—</span>';

    html += `<tr>
      <td class="artist-cell" title="${r.mish_artist}">${r.mish_artist}</td>
      <td class="album-cell" title="${r.mish_album}">${r.mish_album}</td>
      <td class="title-cell" title="${r.title}">${r.title || '<span style="color:#333">not found</span>'}</td>
      <td class="album-cell" title="${r.lib_album}">${r.lib_album}</td>
      <td class="isrc-cell">${r.isrc}</td>
      <td class="duration-cell">${r.duration}</td>
      <td class="duration-cell">${r.peak_year}</td>
      <td class="match-cell">${badge}</td>
      <td class="match-cell">${r.sample_type === 'hit' ? '<span class="match-badge match-exact">Hit</span>' : r.sample_type === 'album_cut' ? '<span class="match-badge match-fuzzy">Cut</span>' : ''}</td>
    </tr>`;
  }

  html += '</tbody></table>';
  document.getElementById('table-wrap').innerHTML = html;
}

function sort(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  renderTable();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function exportCSV() {
  const rows = allResults.filter(r => r.match_type !== 'none');
  if (!rows.length) { alert('No matched tracks to export.'); return; }

  const headers = ['MISH Artist','MISH Album','Track Title','Library Album','ISRC','Duration','Year','Match Type'];
  const lines = [headers.join(',')];
  for (const r of rows) {
    lines.push([r.mish_artist, r.mish_album, r.title, r.lib_album, r.isrc, r.duration, r.peak_year, r.match_type]
      .map(v => `"${(v||'').replace(/"/g,'""')}"`).join(','));
  }

  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `MISH_Library_Coverage_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function clearResults() {
  allResults = [];
  currentFilter = 'all';
  document.getElementById('table-wrap').innerHTML = '<div class="empty-state">Results will appear here after running the search.</div>';
  document.getElementById('stats-bar').style.display = 'none';
  document.getElementById('filter-row').style.display = 'none';
  document.getElementById('export-btn').disabled = true;
  document.getElementById('sample-btn').disabled = true;
  document.getElementById('export-sample-btn').disabled = true;
  samplePlaylist = [];
  document.getElementById('sample-panel').style.display = 'none';
  setStatus('Cleared.');
  setProgress(0);
}

const SPOTIFY_SCOPES     = 'playlist-modify-public playlist-modify-private user-read-private';

let spotifyToken = null;

function base64urlEncode(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function generatePKCE() {
  const verifier = base64urlEncode(crypto.getRandomValues(new Uint8Array(32)));
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  const challenge = base64urlEncode(hash);
  return { verifier, challenge };
}

async function spotifyLogin() {
  const { verifier, challenge } = await generatePKCE();
  sessionStorage.setItem('pkce_verifier', verifier);
  const params = new URLSearchParams({
    client_id:             SPOTIFY_CLIENT_ID,
    response_type:         'code',
    redirect_uri:          SPOTIFY_REDIRECT,
    scope:                 SPOTIFY_SCOPES,
    code_challenge_method: 'S256',
    code_challenge:        challenge,
    state:                 'mish_auth'
  });
  window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}

async function handleSpotifyCallback() {
  const params = new URLSearchParams(window.location.search);
  const code  = params.get('code');
  const state = params.get('state');
  if (!code || state !== 'mish_auth') return;

  // Clean URL without reloading
  window.history.replaceState({}, '', window.location.pathname);

  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier) { showError('PKCE verifier missing — please reconnect Spotify.'); return; }

  const body = new URLSearchParams({
    grant_type:    'authorization_code',
    code,
    redirect_uri:  SPOTIFY_REDIRECT,
    client_id:     SPOTIFY_CLIENT_ID,
    code_verifier: verifier
  });

  const res  = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });
  const data = await res.json();

  if (data.access_token) {
    spotifyToken = data.access_token;
    sessionStorage.removeItem('pkce_verifier');
    await onSpotifyConnected();
  } else {
    showError('Spotify auth failed: ' + (data.error_description || JSON.stringify(data)));
  }
}

async function onSpotifyConnected() {
  // Fetch user profile
  const res  = await fetch('https://api.spotify.com/v1/me', {
    headers: { Authorization: 'Bearer ' + spotifyToken }
  });
  const user = await res.json();
  sessionStorage.setItem('spotify_user_id', user.id);

  document.getElementById('spotify-auth-btn').textContent  = '✓ Spotify Connected';
  document.getElementById('spotify-auth-btn').style.opacity = '0.5';
  document.getElementById('spotify-auth-btn').onclick       = null;
  document.getElementById('spotify-row').style.display      = 'flex';
  document.getElementById('spotify-user').textContent       = 'Signed in as ' + (user.display_name || user.id);

  if (samplePlaylist.length) document.getElementById('push-playlist-btn').disabled = false;
}

// ── Spotify track lookup + playlist push ─────────────────────────────────────

async function spotifyFetch(url, options = {}) {
  return fetch(url, {
    ...options,
    headers: {
      Authorization: 'Bearer ' + spotifyToken,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
}

async function resolveTrackId(track) {
  // 1. Try ISRC first — most reliable
  if (track.isrc) {
    const res  = await spotifyFetch(
      `https://api.spotify.com/v1/search?type=track&q=isrc:${track.isrc}&limit=1`
    );
    const data = await res.json();
    const item = data?.tracks?.items?.[0];
    if (item) return item.uri;
  }

  // 2. Fallback: title + artist search
  const q   = encodeURIComponent(`track:${track.title} artist:${track.mish_artist}`);
  const res = await spotifyFetch(
    `https://api.spotify.com/v1/search?type=track&q=${q}&limit=1`
  );
  const data = await res.json();
  const item = data?.tracks?.items?.[0];
  return item ? item.uri : null;
}

function setSpotifyStatus(msg) {
  document.getElementById('spotify-status').textContent = msg;
}

async function pushToSpotify() {
  if (!spotifyToken)        { showError('Connect Spotify first.'); return; }
  if (!samplePlaylist.length) { showError('Build the 500 sample first.'); return; }

  const btn    = document.getElementById('push-playlist-btn');
  btn.disabled = true;
  btn.textContent = '⏺ Working…';

  const userId = sessionStorage.getItem('spotify_user_id');

  // 1. Create playlist
  setSpotifyStatus('Creating playlist…');
  const createRes  = await spotifyFetch(`https://api.spotify.com/v1/users/${userId}/playlists`, {
    method: 'POST',
    body: JSON.stringify({
      name:        'MISH × Opus Sample — ' + new Date().toLocaleDateString(),
      description: 'Auto-generated 500-track sample playlist. 250 hits + 250 album cuts. Curated by Garth Trinidad.',
      public:      false
    })
  });
  const playlist = await createRes.json();
  if (!playlist.id) {
    showError('Failed to create playlist: ' + JSON.stringify(playlist));
    btn.disabled = false;
    btn.textContent = '⏵ Push to Spotify';
    return;
  }

  // 2. Resolve track URIs (with progress)
  const uris     = [];
  const notFound = [];
  const total    = samplePlaylist.length;

  setSpotifyStatus(`Resolving tracks 0 / ${total}…`);
  setProgress(0);

  for (let i = 0; i < samplePlaylist.length; i++) {
    const uri = await resolveTrackId(samplePlaylist[i]);
    if (uri) uris.push(uri);
    else notFound.push(samplePlaylist[i].title + ' — ' + samplePlaylist[i].mish_artist);

    if (i % 10 === 0) {
      setSpotifyStatus(`Resolving tracks ${i + 1} / ${total}…`);
      setProgress(Math.round((i / total) * 80));
      await sleep(50); // keep UI responsive
    }
  }

  // 3. Add tracks in batches of 100
  setSpotifyStatus(`Adding ${uris.length} tracks to playlist…`);
  for (let i = 0; i < uris.length; i += 100) {
    const batch = uris.slice(i, i + 100);
    await spotifyFetch(`https://api.spotify.com/v1/playlists/${playlist.id}/tracks`, {
      method: 'POST',
      body: JSON.stringify({ uris: batch })
    });
    setProgress(80 + Math.round(((i + 100) / uris.length) * 20));
    await sleep(100);
  }

  setProgress(100);

  const msg = `✓ Playlist created: ${uris.length} tracks added${notFound.length ? `, ${notFound.length} not found on Spotify` : ''}.`;
  setSpotifyStatus(msg);
  setStatus(msg);

  // Link to playlist
  document.getElementById('spotify-row').insertAdjacentHTML('beforeend',
    `<a href="https://open.spotify.com/playlist/${playlist.id}" target="_blank"
        style="font-size:12px; color:#1DB954; text-decoration:none; border-bottom:1px solid #1DB954;">
      Open in Spotify ↗
    </a>`
  );

  btn.textContent = '✓ Done';
  if (notFound.length) {
    console.warn('Tracks not found on Spotify:', notFound);
    setSpotifyStatus(msg + ' (Check console for not-found list)');
  }
}

// Run on page load — handle OAuth callback if returning from Spotify
handleSpotifyCallback();

// ── Sample state ─────────────────────────────────────────────────────────────
let samplePlaylist = [];

const HIT_SIGNALS = ['greatest hits', 'best of', 'anthology', 'collection',
                     'soundtrack', ' ost', 'hits ', 'the essential', 'platinum collection',
                     'solid gold', 'legend', 'singles'];

function isHitAlbum(albumStr) {
  if (!albumStr) return false;
  const a = albumStr.toLowerCase();
  return HIT_SIGNALS.some(s => a.includes(s));
}

function getDecade(yearStr) {
  const y = parseInt(yearStr);
  if (!y || isNaN(y)) return 'Unknown';
  return Math.floor(y / 10) * 10 + 's';
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Era-balanced sampler: given a pool and target count, sample proportionally
// by decade (based on pool composition) — no decade gets more than its fair share
function eraBalancedSample(pool, targetCount) {
  if (pool.length <= targetCount) return pool;

  // Group by decade
  const byDecade = {};
  for (const r of pool) {
    const d = getDecade(r.peak_year);
    if (!byDecade[d]) byDecade[d] = [];
    byDecade[d].push(r);
  }

  const decades = Object.keys(byDecade);
  const total = pool.length;
  const result = [];

  // Proportional quota per decade
  const quotas = {};
  let assigned = 0;
  for (const d of decades) {
    const q = Math.floor((byDecade[d].length / total) * targetCount);
    quotas[d] = q;
    assigned += q;
  }
  // Distribute remainder to largest decades
  let remainder = targetCount - assigned;
  const sorted = decades.sort((a,b) => byDecade[b].length - byDecade[a].length);
  for (let i = 0; i < remainder; i++) {
    quotas[sorted[i % sorted.length]]++;
  }

  for (const d of decades) {
    const shuffled = shuffle(byDecade[d]);
    result.push(...shuffled.slice(0, quotas[d]));
  }

  return result;
}

function buildSample() {
  // Clear previous sample tags
  for (const r of allResults) { delete r.sample_type; }
  samplePlaylist = [];

  const matched = allResults.filter(r => r.match_type !== 'none');

  // Split into hits pool and cuts pool
  // Deduplicate by track id first so the same track doesn't appear twice
  const seen = new Set();
  const hitsPool = [];
  const cutsPool = [];

  // Cap per artist to avoid one act dominating
  const artistHitCount = {};
  const artistCutCount = {};
  const HIT_CAP = 3;
  const CUT_CAP = 2;

  for (const r of matched) {
    if (r.id && seen.has(r.id)) continue;
    if (r.id) seen.add(r.id);

    if (isHitAlbum(r.lib_album)) {
      const c = artistHitCount[r.mish_artist] || 0;
      if (c < HIT_CAP) {
        hitsPool.push(r);
        artistHitCount[r.mish_artist] = c + 1;
      }
    } else {
      const c = artistCutCount[r.mish_artist] || 0;
      if (c < CUT_CAP) {
        cutsPool.push(r);
        artistCutCount[r.mish_artist] = c + 1;
      }
    }
  }

  // Era-balanced sample from each pool
  const hits = eraBalancedSample(hitsPool, 250);
  const cuts = eraBalancedSample(cutsPool, 250);

  // Tag results
  const hitIds = new Set(hits.map(r => r.id || r.title + r.mish_artist));
  const cutIds = new Set(cuts.map(r => r.id || r.title + r.mish_artist));

  for (const r of allResults) {
    const key = r.id || r.title + r.mish_artist;
    if (hitIds.has(key)) r.sample_type = 'hit';
    else if (cutIds.has(key)) r.sample_type = 'album_cut';
  }

  samplePlaylist = [...hits.map(r => ({...r, sample_type:'hit'})),
                    ...cuts.map(r => ({...r, sample_type:'album_cut'}))];

  // Update stats
  document.getElementById('sstat-hits').textContent = hits.length;
  document.getElementById('sstat-cuts').textContent = cuts.length;
  document.getElementById('sstat-total').textContent = hits.length + cuts.length;

  // Decade breakdown display
  const decadeMap = {};
  for (const r of samplePlaylist) {
    const d = getDecade(r.peak_year);
    decadeMap[d] = (decadeMap[d] || 0) + 1;
  }
  const decadeKeys = Object.keys(decadeMap).sort();
  document.getElementById('decade-breakdown').innerHTML = decadeKeys.map(d =>
    `<span style="font-size:11px;color:var(--muted)">${d} <span style="color:var(--accent);font-weight:500">${decadeMap[d]}</span></span>`
  ).join('<span style="color:#333; margin:0 2px">·</span>');

  document.getElementById('sample-panel').style.display = 'block';
  document.getElementById('export-sample-btn').disabled = false;
  document.getElementById('filter-sample-btn').style.display = 'inline-block';
  if (spotifyToken) document.getElementById('push-playlist-btn').disabled = false;

  setStatus(`Sample built: ${hits.length} hits + ${cuts.length} album cuts = ${hits.length + cuts.length} tracks.`);
  renderTable();
}

function exportSampleCSV() {
  if (!samplePlaylist.length) { alert('Build the sample first.'); return; }

  const headers = ['Sample Type','Artist','MISH Album','Track Title','Library Album','ISRC','Duration','Year'];
  const lines = [headers.join(',')];
  for (const r of samplePlaylist) {
    lines.push([r.sample_type, r.mish_artist, r.mish_album, r.title, r.lib_album, r.isrc, r.duration, r.peak_year]
      .map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','));
  }

  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `MISH_500_Sample_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function showError(msg) {
  document.getElementById('error-area').innerHTML = `<div class="error-msg">${msg}</div>`;
}
function clearError() {
  document.getElementById('error-area').innerHTML = '';
}
function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}
function setProgress(pct) {
  document.getElementById('progress').style.width = pct + '%';
}
function formatDuration(secs) {
  if (!secs) return '';
  const m = Math.floor(secs / 60), s = secs % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
